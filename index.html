</head><body><canvas id="c"></canvas>
<script>
/* PeerJS 로더: 같은 폴더의 peerjs.min.js(배포 시 자동 포함) → jsDelivr → unpkg 순서로 시도 */

function n(){if(window.Peer||i>=u.length)return;var s=document.createElement('script');s.src=u[i++];s.onload=function(){if(!window.Peer)n();};s.onerror=n;document.head.appendChild(s);}

<script>
'use strict';
/* =========================================================
   골판지 듀오 : 대결 (v2.0)
   - 운 요소 0 · 모든 조건 대칭 · 오직 실력
   - 로컬 2인 / 봇 연습 / 방 코드 온라인 (락스텝 동기화)
   ========================================================= */
const BUILD='pvp-2.6';
const W=960,H=540,FLOOR=440;
const FONT='system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);          // 시각 효과 전용 (게임 규칙에는 절대 쓰지 않음)
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

/* ---------- 캔버스 · 오류 처리 ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SC=1,OX=0,OY=0,DPR=1,SW=960,SH=540,ANIM=0;
let PORTRAIT=false,portraitOK=false,ROT_BTN=null;
const ERR={msg:'',until:0,n:0};
function reportErr(e){try{ERR.msg=String((e&&e.message)||e).slice(0,70);ERR.until=performance.now()+7000;if(ERR.n++<5)console.error(e);}catch(_){}}
window.addEventListener('error',ev=>reportErr(ev.error||ev.message));
window.addEventListener('unhandledrejection',ev=>{try{ev.preventDefault();}catch(_){}reportErr(ev.reason);});
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);SW=window.innerWidth;SH=window.innerHeight;
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  SC=Math.min(SW/W,SH/H);OX=(SW-W*SC)/2;OY=(SH-H*SC)/2;PORTRAIT=SH>SW*1.15;
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);resize();

/* ---------- 앱 상태 ---------- */
const APP={scene:'menu',mode:'bot',paused:false,showHelp:false,joinCode:'',
  cfg:{map:0,bo:2,w:[0,1],bot:1},      // bo = 먼저 N라운드 이기면 승리
  S:null,bots:[null,null],result:null,leaveArm:0,acc:0,rematch:[false,false],oppLeft:false};

/* ---------- 소리 ---------- */
let AC=null,muted=false;const lastSfx={};
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){try{const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
}
function tone(f,d,type,v,slide){
  if(muted||!AC)return;
  try{const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const SFX={
  shoot:()=>tone(520,.05,'square',.014,-220),shotgun:()=>tone(200,.12,'sawtooth',.05,-120),lob:()=>tone(260,.15,'triangle',.05,-100),
  hit:()=>tone(240,.05,'triangle',.04),hurt:()=>tone(170,.25,'sawtooth',.06,-120),dash:()=>tone(300,.12,'sine',.05,300),
  jump:()=>tone(330,.1,'square',.02,200),boom:()=>tone(100,.4,'sawtooth',.07,-60),parry:()=>{tone(1250,.18,'sine',.08,-500);tone(1900,.1,'triangle',.04,-600);},
  pw:()=>tone(700,.05,'triangle',.02,200),ex:()=>tone(150,.4,'sawtooth',.07,500),ko:()=>{tone(120,.6,'sawtooth',.08,-60);},
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.07),i*120)),
  lose:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.07),i*160)),
  mark:()=>{tone(1400,.1,'square',.05);setTimeout(()=>tone(1400,.1,'square',.05),140);setTimeout(()=>tone(1800,.2,'square',.05),280);},snipe:()=>{tone(90,.5,'sawtooth',.09,-40);tone(1600,.12,'square',.04,-1200);},charged:()=>tone(1100,.12,'triangle',.04),
  pad:()=>tone(300,.18,'square',.04,900),lava:()=>tone(130,.2,'sawtooth',.06,-60),
  beep:()=>tone(660,.12,'square',.04),go:()=>tone(990,.3,'square',.05),
};
const SFX_GAP={shoot:.07,hit:.04,jump:.1,pw:.1};
function playSfx(c){const g=SFX_GAP[c]||0;if(g){const n=performance.now();if(n-(lastSfx[c]||0)<g*1000)return;lastSfx[c]=n;}if(SFX[c])SFX[c]();}

/* ---------- 입력 ---------- */
const KEYS=['l','r','u','d','jump','shoot','dash','lock','special','swap'];   // swap = 패링
const BIT={L:1,R:2,U:4,D:8,J:16,S:32,DA:64,LK:128,EX:256,PA:512};
const SET1={l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',jump:'KeyF',shoot:'KeyG',dash:'KeyH',lock:'KeyR',special:'KeyT',swap:'KeyQ'};
const SET2={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',jump:'Period',shoot:'Slash',dash:'Comma',lock:'Semicolon',special:'Quote',swap:'KeyL'};
const ALT={jump:'Space',shoot:'KeyJ',dash:'KeyK',lock:'ShiftLeft',special:'KeyU',swap:'KeyI'};
const keys={},latch={},tlatch={};
const usedCodes=new Set([...Object.values(SET1),...Object.values(SET2),...Object.values(ALT),'Escape','Space']);
const bitsOf=(set)=>{let b=0;KEYS.forEach((k,n)=>{if(set[k]&&(keys[set[k]]||latch[set[k]]))b|=1<<n;});return b;};
function readPad(i){
  let b=0;const pads=(navigator.getGamepads&&navigator.getGamepads())||[];const gp=pads[i];if(!gp)return 0;
  const bp=n=>gp.buttons[n]&&gp.buttons[n].pressed;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(ax<-.4||bp(14))b|=BIT.L;if(ax>.4||bp(15))b|=BIT.R;if(ay<-.4||bp(12))b|=BIT.U;if(ay>.4||bp(13))b|=BIT.D;
  if(bp(0))b|=BIT.J;if(bp(2)||bp(7))b|=BIT.S;if(bp(1))b|=BIT.DA;if(bp(4)||bp(6))b|=BIT.LK;if(bp(3))b|=BIT.EX;if(bp(5))b|=BIT.PA;
  return b;
}
const IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
const tp=new Map();let touchBits=0;
const PTR={x:-1,y:-1,down:false,touch:false};
function tLayout(){
  const u=Math.min(SH,SW*.62)/100;
  return{u,stick:{x:Math.max(19*u,SW*.12),y:SH-25*u,r:14*u},btns:[
    {k:'shoot',b:BIT.S,x:SW-15*u,y:SH-21*u,r:11*u,l:'쏘기'},{k:'jump',b:BIT.J,x:SW-36*u,y:SH-12.5*u,r:9*u,l:'점프'},
    {k:'dash',b:BIT.DA,x:SW-12*u,y:SH-46*u,r:8*u,l:'대시'},{k:'parry',b:BIT.PA,x:SW-33*u,y:SH-34*u,r:7.5*u,l:'패링'},
    {k:'ex',b:BIT.EX,x:SW-49*u,y:SH-24*u,r:7*u,l:'EX'},{k:'lock',b:BIT.LK,x:OX+(W-52)*SC,y:OY+140*SC,r:19*SC,l:'고정'}]};
}
function updateTouchBits(){
  touchBits=0;const L=tLayout();
  for(const o of tp.values()){
    if(o.z==='stick'){const dx=(o.x-o.ox)/L.stick.r,dy=(o.y-o.oy)/L.stick.r;
      if(dx<-.35)touchBits|=BIT.L;if(dx>.35)touchBits|=BIT.R;if(dy<-.4)touchBits|=BIT.U;if(dy>.4)touchBits|=BIT.D;}
    else if(o.z)touchBits|=o.z;
  }
}
function sampleLocal(){let b=bitsOf(SET1)|bitsOf(SET2)|bitsOf(ALT)|readPad(0)|touchBits|(tlatch.v|0);return b;}   // 혼자/온라인
function sampleP1(){return bitsOf(SET1)|readPad(0)|touchBits|(tlatch.v|0);}
function sampleP2(){return bitsOf(SET2)|readPad(1);}
function clearLatch(){for(const k in latch)delete latch[k];tlatch.v=0;}

window.addEventListener('keydown',e=>{
  if(APP.scene==='join'){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Backspace'){APP.joinCode=APP.joinCode.slice(0,-1);e.preventDefault();return;}
    if(e.key==='Enter'){doJoin();e.preventDefault();return;}
    if(e.key==='Escape'){goMenu();return;}
    const ch=(e.key||'').toUpperCase();if(ch.length===1&&CODE_CHARS.includes(ch)&&APP.joinCode.length<5){APP.joinCode+=ch;net.status='';}
    return;
  }
  if(usedCodes.has(e.code))e.preventDefault();
  if(!keys[e.code])latch[e.code]=true;
  keys[e.code]=true;audio();
  if(e.code==='KeyM')muted=!muted;
  if(e.code==='Escape'||e.code==='KeyP'){
    if(APP.scene==='play'){if(APP.mode==='local'||APP.mode==='bot')APP.paused=!APP.paused;}
    else if(APP.scene==='menu'&&APP.showHelp)APP.showHelp=false;
  }
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('paste',e=>{
  if(APP.scene!=='join')return;
  const t=(((e.clipboardData&&e.clipboardData.getData('text'))||'')+'').toUpperCase().split('').filter(c=>CODE_CHARS.includes(c)).join('').slice(0,5);
  if(t){APP.joinCode=t;net.status='';}
});
function autoPause(){if(APP.scene==='play'&&(APP.mode==='local'||APP.mode==='bot'))APP.paused=true;}
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;autoPause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause();});
document.addEventListener('gesturestart',e=>e.preventDefault());

cv.addEventListener('pointerdown',e=>{
  audio();e.preventDefault();const sx=e.clientX,sy=e.clientY;
  PTR.touch=e.pointerType==='touch';PTR.down=true;PTR.x=(sx-OX)/SC;PTR.y=(sy-OY)/SC;
  if(PORTRAIT&&!portraitOK){
    if(ROT_BTN&&sx>=ROT_BTN.x&&sx<=ROT_BTN.x+ROT_BTN.w&&sy>=ROT_BTN.y&&sy<=ROT_BTN.y+ROT_BTN.h)portraitOK=true;
    return;
  }
  const lx=PTR.x,ly=PTR.y,pad=PTR.touch?8:0;
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(b.enabled&&lx>=b.x-pad&&lx<=b.x+b.w+pad&&ly>=b.y-pad&&ly<=b.y+b.h+pad){b.fn();return;}}
  if(APP.scene==='play'&&PTR.touch&&!APP.paused){
    const L=tLayout();let z=null,ox=0,oy=0;
    if(sx<SW*.4&&sy>SH*.3){z='stick';const near=dist(sx,sy,L.stick.x,L.stick.y)<L.stick.r*1.4;ox=near?L.stick.x:sx;oy=near?L.stick.y:sy;}
    else for(const b of L.btns){if(dist(sx,sy,b.x,b.y)<b.r*1.3){z=b.b;tlatch.v=(tlatch.v|0)|b.b;break;}}
    tp.set(e.pointerId,{x:sx,y:sy,z,ox,oy});updateTouchBits();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  }
});
cv.addEventListener('pointermove',e=>{
  PTR.touch=e.pointerType==='touch';PTR.x=(e.clientX-OX)/SC;PTR.y=(e.clientY-OY)/SC;
  const o=tp.get(e.pointerId);if(o){o.x=e.clientX;o.y=e.clientY;updateTouchBits();}
});
const pEnd=e=>{PTR.down=false;if(e.pointerType==='touch'){PTR.x=-1;PTR.y=-1;}if(tp.delete(e.pointerId))updateTouchBits();};
cv.addEventListener('pointerup',pEnd);cv.addEventListener('pointercancel',pEnd);
cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'){PTR.x=-1;PTR.y=-1;PTR.down=false;}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* =========================================================
   대결 시뮬레이션 (결정론) — DOM·랜덤·삼각함수 사용 금지
   60틱/초 고정, 입력은 비트마스크 2개 → 상태 갱신
   ========================================================= */
/*SIM_BEGIN*/
const PV={FLOOR:440,GR:.55,JV:-11.4,MAXF:15,RUN:4.4,HW:12,PH:46,
  DASH_T:9,DASH_SP:9.5,DASH_CD:48,DASH_INV:3,PARRY_T:8,PARRY_CD:45,PARRY_HIT_CD:16,PARRY_R:32,
  HP:100,COUNT:180,FIGHT:3600,REND:150,EXMAX:100,PADV:-17,CHG_FULL:130,CHG_HALF:65,MARK_T:150,DT:1/60};
const WP=[
  {n:'피스톨',cd:10,sp:13,r:5,life:75,dmg:3,g:0},
  {n:'샷건',cd:34,sp:11,r:5,life:24,dmg:5,g:0},
  {n:'박격포',cd:50,sp:8,r:8,life:150,dmg:22,g:.28},
  {n:'저격총',cd:40,sp:21,r:4,life:45,dmg:22,g:0,k:4},
  {n:'화염방사기',cd:6,sp:6.5,r:7,life:15,dmg:2,g:0,k:5},
  {n:'바운스건',cd:30,sp:9,r:6,life:85,dmg:8,g:0,k:6}];
const MAPS=[
  {n:'책상 위',g:'기본 맵',pl:[[90,345,200],[380,265,200],[670,345,200]]},
  {n:'서랍 계단',g:'기본 맵',pl:[[150,350,150],[400,255,160],[660,350,150]]},
  {n:'평지',g:'기본 맵 · 발판 없음',pl:[]},
  {n:'높은 탑',g:'기본 맵 · 중앙 2층',pl:[[100,340,160],[700,340,160],[400,350,160],[420,245,120]]},
  {n:'지그재그',g:'기본 맵 · 계단 발판',pl:[[60,360,140],[760,360,140],[250,290,120],[590,290,120],[400,200,160]]},
  {n:'점프대 광장',g:'바닥 점프대를 밟으면 높이 솟아요',pl:[[400,215,160]],pads:[[230,70],[660,70]]},
  {n:'움직이는 다리',g:'양옆 발판이 좌우로 움직여요',pl:[[120,340,140,100,420,1],[700,340,140,100,420,-1],[400,250,160]]},
  {n:'용암 지대',g:'가운데 바닥이 주기적으로 불타요',pl:[[120,340,150],[690,340,150],[420,330,120]],hz:[400,560]},
  {n:'달 기지',g:'저중력 · 높이 뜨고 천천히 떨어져요',pl:[[100,330,160],[700,330,160],[380,230,200],[400,110,160]],gr:.3},
  {n:'바람 협곡',g:'5초마다 바람 방향이 바뀌어요',pl:[[150,360,130],[680,360,130],[395,280,170]],wind:.12,wper:300},
  {n:'컨베이어',g:'바닥이 가운데로 끌어당겨요',pl:[[100,340,180],[680,340,180],[380,250,200]],cv:1.2}];
const LAVA_T=600,LAVA_WARN=240,LAVA_ON=300,LAVA_END=480;
function lavaPh(S){const t=S.fightT%LAVA_T;return t>=LAVA_ON&&t<LAVA_END?2:(t>=LAVA_WARN&&t<LAVA_ON?1:0);}
function windDir(S,M){return ((((S.fightT/M.wper)|0)+S.round)&1)?1:-1;}
// 움직이는 발판 위치 갱신 (tick 기반 삼각파, 정수)
function buildPl(S){
  const src=MAPS[S.map].pl,out=[],dx=[];
  for(let i=0;i<src.length;i++){
    const q=src[i];let x=q[0];
    if(q[3]){const per=q[4],half=per>>1,ph=S.fightT%per,v=ph<half?ph:per-ph;x=q[0]+q[5]*((((v*2*q[3])/half)|0)-q[3]);}
    out.push([x,q[1],q[2]]);dx.push(S.pl&&S.pl[i]?x-S.pl[i][0]:0);
  }
  S.pl=out;S.pdx=dx;
}
const B_L=1,B_R=2,B_U=4,B_D=8,B_J=16,B_S=32,B_DA=64,B_LK=128,B_EX=256,B_PA=512;

function mkP(i,w){return{i,w,x:i?790:170,y:PV.FLOOR,vx:0,vy:0,face:i?-1:1,ax:i?-1:1,ay:0,hp:PV.HP,ex:0,cd:0,
  dashT:0,dashCd:0,dashDir:1,airDash:0,coy:0,jb:0,onG:1,dropT:0,pT:0,pCd:0,jmp:0,prev:0,lock:0,run:0,kb:0,on:-1,hz:0,chg:0,snUsed:0,mk:0,mkBy:0};}
function simEv(S,t,x,y,a){if(S.ev.length<300)S.ev.push([t,x,y,a|0]);}
function initSim(cfg){
  const S={tick:0,phase:'count',pt:PV.COUNT,round:1,score:[0,0],bo:cfg.bo,map:cfg.map,w:[cfg.w[0],cfg.w[1]],
    p:[mkP(0,cfg.w[0]),mkP(1,cfg.w[1])],b:[],ev:[],st:{sh:[0,0],ht:[0,0],dm:[0,0],pa:[0,0]},winner:-2,how:'',draws:0,lastW:-1,fightT:0,gr:MAPS[cfg.map].gr||PV.GR,pl:null,pdx:[]};
  buildPl(S);return S;
}
function startRound(S){
  S.round++;S.p[0]=mkP(0,S.w[0]);S.p[1]=mkP(1,S.w[1]);S.b=[];S.phase='count';S.pt=PV.COUNT;S.how='';S.lastW=-1;S.fightT=0;
}
function endRound(S,how,w){
  S.phase='rend';S.pt=PV.REND;S.how=how;S.lastW=w;
  if(w>=0){S.score[w]++;if(S.score[w]>=S.bo){S.phase='mend';S.winner=w;}}
  else{S.draws++;if(S.draws>=3){S.phase='mend';S.winner=-1;}}
  simEv(S,'ko',S.p[w>=0?1-w:0].x,S.p[w>=0?1-w:0].y-30,w);
}
function dmgTo(S,o,u,n){
  if(S.phase!=='fight')return;
  o.hp-=n;if(o.hp<0)o.hp=0;
  const a=S.p[u.own];S.st.dm[u.own]+=n;S.st.ht[u.own]++;
  a.ex+=n*1.0;if(a.ex>PV.EXMAX)a.ex=PV.EXMAX;
  o.ex+=n*.7;if(o.ex>PV.EXMAX)o.ex=PV.EXMAX;
  simEv(S,'hit',u.x,u.y,u.own);if(n>=14)simEv(S,'hurt',o.x,o.y-23,o.i);
}
function addB(S,p,x,y,vx,vy,w,k){
  S.b.push({x,y,vx,vy,r:w.r,own:p.i,k,dmg:w.dmg,life:w.life,g:w.g,rf:0,age:0,bn:0,hit:[0,0]});
}
function fire(S,p){
  const w=WP[p.w],mx=p.x+p.ax*26,my=p.y-30+p.ay*26;
  if(p.w===1){
    for(let k=-1;k<=1;k++){
      let dx=p.ax,dy=p.ay;
      if(k){const s=k*.19867,c=.98007;const nx=dx*c-dy*s,ny=dx*s+dy*c;dx=nx;dy=ny;}
      addB(S,p,mx,my,dx*w.sp,dy*w.sp,w,1);
    }
    simEv(S,'shotgun',mx,my,p.i);
  }else if(p.w===2){addB(S,p,mx,my,p.ax*w.sp,p.ay*w.sp-2.5,w,2);simEv(S,'lob',mx,my,p.i);}
  else{addB(S,p,mx,my,p.ax*w.sp,p.ay*w.sp,w,w.k||0);simEv(S,'shoot',mx,my,p.i);}
  p.cd=w.cd;S.st.sh[p.i]++;
}
function fireEX(S,p){
  const mx=p.x+p.ax*26,my=p.y-30+p.ay*26;
  S.b.push({x:mx,y:my,vx:p.ax*10,vy:p.ay*10,r:16,own:p.i,k:3,dmg:32,life:80,g:0,rf:0,age:0,hit:[0,0]});
  p.ex=0;p.cd=20;S.st.sh[p.i]++;simEv(S,'ex',mx,my,p.i);
}

function simStep(S,inp){

function octBits(dx,dy,grounded){
  const ax=dx<0?-dx:dx,ay=dy<0?-dy:dy;let b=0;
  const horiz=ay<ax*.4142,vert=ax<ay*.4142;
  if(!vert)b|=dx>0?2:1;

function botThreat(S,me,bot){

  for(let j=0;j<S.b.length;j++){
    const u=S.b[j];if(u.own===me.i||u.age<bot.R)continue;
    let x=u.x,y=u.y;const vx=u.vx;let vy=u.vy;

      x+=vx;y+=vy;vy+=u.g;const dx=x-cx,dy=y-cy;

    }

}
function botInput(S,i,bot){

const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const net={role:'none',peer:null,conn:null,code:'',status:'',connected:false,rtt:0,pings:[],pingIv:null,tries:0,verBad:false,hiSent:false};

function leaveNet(sayBye){

  if(net.pingIv){clearInterval(net.pingIv);net.pingIv=null;}
  net.role='none';net.peer=null;net.conn=null;net.code='';net.status='';net.connected=false;net.rtt=0;net.pings=[];net.tries=0;net.verBad=false;net.hiSent=false;
  LS.on=false;

}
function sendCfg(){if(net.role==='host')netSend({t:'cfg',c:{map:APP.cfg.map,bo:APP.cfg.bo,w:[APP.cfg.w[0],APP.cfg.w[1]]}});}
function onPeerGone(){

  if(APP.scene==='play'||APP.scene==='result'){APP.oppLeft=true;LS.on=false;}
  else if(net.role==='host'){net.status='친구가 나갔어요. 다시 기다리는 중';}
  else if(net.role==='guest'){net.status='연결이 끊겼어요';}
}
function bindConn(conn){
  conn.on('data',netMsg);
  conn.on('close',onPeerGone);
  conn.on('error',()=>{});
}
function hostRoom(){
  if(typeof Peer==='undefined'){net.status='연결 라이브러리를 불러오지 못했어요 (인터넷 확인)';return;}
  try{if(net.peer)net.peer.destroy();}catch(e){}
  net.role='host';net.connected=false;net.conn=null;net.code=genCode();net.status='방을 만드는 중...';net.verBad=false;net.hiSent=false;
  let peer;try{peer=new Peer('cbduo-'+net.code);}catch(e){net.status='오류: '+((e&&e.message)||'연결 실패');return;}
  net.peer=peer;
  peer.on('open',()=>{net.status='친구를 기다리는 중';});
  peer.on('connection',conn=>{
    if(net.conn&&net.conn.open){try{conn.close();}catch(e){}return;}
    net.conn=conn;bindConn(conn);
    conn.on('open',()=>{net.connected=true;net.status='친구가 들어왔어요!';netSend({t:'hi',b:BUILD});startPings();sendCfg();});
  });
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&net.tries<4){net.tries++;hostRoom();}
    else net.status='오류: '+err.type;
  });
}
function joinRoom(code){
  if(typeof Peer==='undefined'){net.status='연결 라이브러리를 불러오지 못했어요 (인터넷 확인)';return;}
  leaveNet(false);net.role='guest';net.code=code;net.status='연결 중...';
  let peer;try{peer=new Peer();}catch(e){net.status='오류: '+((e&&e.message)||'연결 실패');return;}
  net.peer=peer;
  const timer=setTimeout(()=>{if(!net.connected&&net.role==='guest')net.status='연결 시간 초과 — 코드를 확인해 주세요';},12000);
  peer.on('open',()=>{
    let conn;try{conn=peer.connect('cbduo-'+code,{serialization:'json',reliable:true});}catch(e){net.status='오류: 연결 실패';return;}
    net.conn=conn;bindConn(conn);
    conn.on('open',()=>{clearTimeout(timer);net.connected=true;net.status='연결됨';});
  });
  peer.on('error',err=>{net.status=err.type==='peer-unavailable'?'그 코드의 방이 없어요':'오류: '+err.type;});
}
function startPings(){

}
function calcD(){
  const a=net.pings.slice().sort((x,y)=>x-y);if(!a.length)return 5;

function netMsg(m){

      if(net.role==='guest'&&!net.hiSent){net.hiSent=true;netSend({t:'hi',b:BUILD});}
      break;
    case'ping':netSend({t:'pong',s:m.s});break;

        APP.cfg.map=clamp(m.c.map|0,0,MAPS.length-1);APP.cfg.bo=m.c.bo===3?3:2;
        APP.cfg.w=[clamp(m.c.w[0]|0,0,WP.length-1),clamp(m.c.w[1]|0,0,WP.length-1)];

        startOnline(c,clamp(m.D|0,2,12),1);

    case'lobby':if(APP.scene==='play'||APP.scene==='result'){LS.on=false;APP.scene='lobby';APP.oppLeft=false;}break;

const LS={on:false,slot:0,tick:0,D:4,nl:0,loc:{},rem:{},hist:[],own:{},theirs:{},desync:false,stall:0,lastRecv:0};
function lsInit(D,slot){
  LS.on=true;LS.slot=slot;LS.D=D;LS.tick=0;LS.nl=D;LS.loc={};LS.rem={};LS.hist=[];LS.own={};LS.theirs={};LS.desync=false;LS.stall=0;LS.lastRecv=performance.now();
  for(let i=0;i<D;i++){LS.loc[i]=0;LS.rem[i]=0;}
}
function lsSend(){if(!LS.hist.length)return;netSend({t:'pi',a:LS.hist[0][0],v:LS.hist.map(h=>h[1])});}
function lsRecv(m){
  if(!LS.on||!Array.isArray(m.v))return;
  const a=m.a|0;
  for(let i=0;i<m.v.length&&i<16;i++){const k=a+i;if(k>=LS.tick&&LS.rem[k]===undefined)LS.rem[k]=(m.v[i]|0)&1023;}
  LS.lastRecv=performance.now();
}
function lsCheck(m){
  const k=m.k|0,h=m.h|0;
  if(LS.own[k]!==undefined){if(LS.own[k]!==h)LS.desync=true;delete LS.own[k];}
  else LS.theirs[k]=h;
}
function lsPump(dt){
  LS.acc=Math.min((LS.acc||0)+dt,.2);let n=0;
  while(LS.acc>=PV.DT&&n<6){
    while(LS.nl<=LS.tick+LS.D){
      const b=sampleLocal();clearLatch();LS.loc[LS.nl]=b;LS.hist.push([LS.nl,b]);if(LS.hist.length>8)LS.hist.shift();LS.nl++;lsSend();
    }
    const a=LS.loc[LS.tick],r=LS.rem[LS.tick];
    if(a===undefined||r===undefined){LS.stall++;break;}
    LS.stall=0;
    simStep(APP.S,LS.slot===0?[a,r]:[r,a]);
    delete LS.loc[LS.tick];delete LS.rem[LS.tick];LS.tick++;LS.acc-=PV.DT;n++;
    if(LS.tick%30===0){
      const h=simHash(APP.S);LS.own[LS.tick]=h;netSend({t:'ck',k:LS.tick,h});
      const t=LS.theirs[LS.tick];if(t!==undefined){if(t!==h)LS.desync=true;delete LS.theirs[LS.tick];delete LS.own[LS.tick];}
      for(const k in LS.own)if(+k<LS.tick-900)delete LS.own[k];
      for(const k in LS.theirs)if(+k<LS.tick-900)delete LS.theirs[k];
    }
    drainEv();
  }
  if(LS.stall>0&&LS.acc>.1)LS.acc=.1;
}

    for(let i=0;i<3;i++)btn(730+i*64,366,60,44,BOTLV[i],()=>{APP.cfg.bot=i;},{size:14,sel:APP.cfg.bot===i,col:APP.cfg.bot===i?'#ffe9b8':'#ead0a0',dark:'#b98448',r:10,lip:4});
  }
  if(guest){
    if(!net.connected&&bad)btn(280,440,400,58,'코드 다시 입력',()=>{leaveNet(false);APP.joinCode='';APP.mode='bot';APP.scene='join';},{size:22,icon:'join',col:'#ffd9a8'});
    else btn(280,440,400,58,'방장이 시작하길 기다리는 중...',()=>{},{enabled:false,size:20,col:'#e8c88f'});
  }else{
    const can=!host||(net.connected&&!net.verBad);
    btn(300,440,360,58,host&&!net.connected?'친구를 기다리는 중...':'대결 시작!',()=>{if(can)startMatch();},{enabled:can,col:'#8fd18a',dark:'#5a9c55',size:host&&!net.connected?20:28,icon:'play'});
  }
}
function statRow(y,label,a,b,hl){
  txt(label,480,y,15,'#7a5a3a');
  txt(a,330,y,hl===0?24:20,hl===0?'#2e8b4a':'#3b2210',null,'900');txt(b,630,y,hl===1?24:20,hl===1?'#2e8b4a':'#3b2210',null,'900');
}
function drawResult(){
  const S=APP.S;if(!S)return;
  ctx.fillStyle='rgba(30,16,6,.62)';ctx.fillRect(0,0,W,H);
  const cx=W/2,w=560,x=cx-w/2,y=64,h=412;
  ctx.fillStyle='rgba(50,25,8,.3)';rr(x+4,y+8,w,h,22);ctx.fill();
  ctx.fillStyle='#f6e6c2';rr(x,y,w,h,22);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#6b4423';ctx.stroke();
  const win=S.winner,online=APP.mode==='host'||APP.mode==='guest',me=APP.mode==='guest'?1:0;
  let head,col;
  if(win<0){head='무승부';col='#7a6a4a';}
  else if(APP.mode==='local'){head=(win+1)+'P 승리!';col=PCOL[win].b;}
  else if(win===me){head='승리!';col='#3a9d5d';}else{head='패배…';col='#c9503f';}
  ctx.fillStyle=col;rr(cx-180,y-26,360,64,16);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
  txt(head,cx,y+8,40,'#fff',null,'900',{w:6,c:'rgba(0,0,0,.25)'});
  const names=APP.mode==='bot'?['나','봇']:online?(me===0?['나','상대']:['상대','나']):['1P','2P'];
  txt(MAPS[S.map].n+' · '+S.bo+'선승 · '+S.round+'라운드',cx,y+62,16,'#5a3a1e');
  ctx.fillStyle=PCOL[0].b;rr(330-50,y+86,100,28,14);ctx.fill();txt(names[0],330,y+100,16,'#fff');
  ctx.fillStyle=PCOL[1].b;rr(630-50,y+86,100,28,14);ctx.fill();txt(names[1],630,y+100,16,'#fff');
  const pct=i=>S.st.sh[i]?Math.round(100*S.st.ht[i]/S.st.sh[i])+'%':'-';
  const dm=i=>String(Math.round(S.st.dm[i]));
  statRow(y+148,'라운드 승',String(S.score[0]),String(S.score[1]),S.score[0]>S.score[1]?0:(S.score[1]>S.score[0]?1:-1));
  statRow(y+190,'명중률',pct(0),pct(1),(S.st.sh[0]&&S.st.sh[1])?(S.st.ht[0]/S.st.sh[0]>S.st.ht[1]/S.st.sh[1]?0:1):-1);
  statRow(y+232,'가한 피해',dm(0),dm(1),S.st.dm[0]>S.st.dm[1]?0:(S.st.dm[1]>S.st.dm[0]?1:-1));
  statRow(y+274,'패링 성공',String(S.st.pa[0]),String(S.st.pa[1]),S.st.pa[0]>S.st.pa[1]?0:(S.st.pa[1]>S.st.pa[0]?1:-1));
  if(APP.oppLeft){
    txt('상대가 나갔어요',cx,y+332,20,'#b3261e');
    btn(cx-100,y+352,200,48,'메뉴로',goMenu,{icon:'home',size:20});
  }else{
    const waiting=online&&APP.rematch[LS.slot]&&!APP.rematch[1-LS.slot];
    if(online&&APP.rematch[1-LS.slot]&&!APP.rematch[LS.slot])txt('상대가 다시 하자고 해요!',cx,y+328,16,'#2e8b4a');
    if(waiting)txt('상대를 기다리는 중…',cx,y+328,16,'#5a3a1e');
    btn(cx-250,y+344,240,56,waiting?'기다리는 중…':'다시 대결',askRematch,{icon:'retry',col:'#8fd18a',dark:'#5a9c55',size:22,enabled:!waiting});
    btn(cx+10,y+344,240,56,'로비로',backToLobby,{icon:'home',size:22});
  }
}
function drawOppLeft(){
  if(APP.scene!=='play')return;
  ctx.fillStyle='rgba(30,16,6,.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f6e6c2';rr(W/2-190,190,380,170,20);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#6b4423';ctx.stroke();
  txt('상대가 나갔어요',W/2,236,30,'#b3261e',null,'900');
  btn(W/2-100,274,200,52,'메뉴로',goMenu,{icon:'home',size:22});
}
function drawRotate(){
  ctx.save();ctx.fillStyle='rgba(20,12,6,.95)';ctx.fillRect(0,0,SW,SH);
  const cx=SW/2,cy=SH*.36,a=-Math.PI/2*(.5+.5*Math.sin(ANIM*2));
  ctx.translate(cx,cy);ctx.rotate(a);ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.fillStyle='#3b2210';rr(-26,-46,52,92,12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#e8893a';rr(-19,-36,38,64,5);ctx.fill();ctx.restore();
  ctx.save();const fs=Math.max(18,Math.min(30,SW*.065));
  txt('화면을 가로로 돌려 주세요',cx,cy+90,fs,'#fff');txt('세로에서는 게임 화면이 너무 작아요',cx,cy+90+fs*1.5,Math.max(13,fs*.6),'#d9c49c','center','600');
  const bw=190,bh=46,bx=cx-bw/2,by=cy+90+fs*3;ROT_BTN={x:bx,y:by,w:bw,h:bh};
  ctx.fillStyle='#e8b068';rr(bx,by,bw,bh,14);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#6b4423';ctx.stroke();txt('그냥 계속하기',cx,by+bh/2+1,18,'#3b2210');ctx.restore();
}
function drawErr(){
  if(performance.now()>ERR.until)return;
  const w=Math.min(SW-24,440),x=(SW-w)/2,y=SH-64;
  ctx.save();ctx.fillStyle='rgba(120,20,12,.92)';rr(x,y,w,48,12);ctx.fill();
  txt('문제가 생겼어요. 새로고침하면 해결될 수 있어요',SW/2,y+17,14,'#fff');txt(ERR.msg,SW/2,y+35,11,'#ffd0c8','center','500');ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#1d140d';ctx.fillRect(0,0,SW,SH);
  ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  buttons=[];HOVER=false;
  switch(APP.scene){
    case'menu':drawMenu();break;
    case'join':drawJoin();break;
    case'lobby':drawLobby();break;
    default:drawArena();if(APP.scene==='result')drawResult();if(APP.oppLeft)drawOppLeft();
  }
  ctx.restore();
  if(IS_TOUCH&&APP.scene==='play'&&!APP.paused&&!APP.oppLeft)drawTouch();
  if(PORTRAIT&&!portraitOK)drawRotate();else ROT_BTN=null;
  drawErr();
  cv.style.cursor=HOVER?'pointer':'default';
}

/* ---------- 메인 루프 ---------- */
function localPump(dt){
  APP.acc=Math.min(APP.acc+dt,.2);let n=0;
  while(APP.acc>=PV.DT&&n<6){
    let i0,i1;
    if(APP.mode==='local'){i0=sampleP1();i1=sampleP2();}
    else{i0=sampleLocal();i1=botInput(APP.S,1,APP.bots[1]);}
    clearLatch();
    simStep(APP.S,[i0,i1]);APP.acc-=PV.DT;n++;drainEv();
  }
}
function update(dt){
  ANIM+=dt;updateFx(dt);
  if(APP.leaveArm>0)APP.leaveArm=Math.max(0,APP.leaveArm-dt);
  const S=APP.S;
  if(S&&(APP.scene==='play')&&!APP.paused&&!APP.oppLeft){
    if(APP.mode==='host'||APP.mode==='guest'){if(LS.on)lsPump(dt);}
    else localPump(dt);
    if(S.phase==='fight')APP.secs=Math.max(0,Math.ceil(S.pt/60));
    if(S.phase==='mend'){
      APP.endT+=dt;
      if(APP.endT>1.8){
        APP.scene='result';
        const me=APP.mode==='guest'?1:0;
        if(S.winner<0)playSfx('beep');else if(APP.mode==='local'||S.winner===me)playSfx('win');else playSfx('lose');
      }
    }
  }
}
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;
  try{update(dt);draw();}catch(e){reportErr(e);try{cv.width=cv.width;}catch(_){}}
}
bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;paintBG(bgc.getContext('2d'));
requestAnimationFrame(frame);

</script></body></html>
